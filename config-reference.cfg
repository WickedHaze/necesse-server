# Necesse server configuration reference
# ========================================
# There are TWO config files on a deployed server:
#
#   1. /opt/necesse-server/cfg/server.cfg          - server-level settings
#   2. <world.zip>/world/worldSettings.cfg          - per-world settings
#      (stored INSIDE the world save; edit via the deathpenalty/settings
#       commands or by re-zipping a modified copy, then restart the service)
#
# Editing either file takes effect after `sudo systemctl restart necesse`.
# Values shown below are the ones currently deployed; options in comments
# list the valid choices.

# ===========================================================================
# 1) SERVER CONFIG  (/opt/necesse-server/cfg/server.cfg)
#    Managed on deploy by setup.sh (through the PORT/SLOTS/WORLD/PASSWORD/MOTD
#    env vars), or edit directly and restart.
# ===========================================================================
SERVER = {
    port = 14159,                  // [0 - 65535] Server default port (UDP)
    slots = 10,                    // [1 - 250] Max players
    password = "absolutegaming",   // Join password (blank = no password).
                                   // NOTE: no quote marks inside the value.
                                   // After first successful login the client's
                                   // player UUID is saved in cfg/auth and it no
                                   // longer prompts for the password.
    maxClientLatencySeconds = 30,  // Kick clients above this latency (sec)
    pauseWhenEmpty = true,         // Pause world simulation when 0 players online
    // => true (default): world freezes while nobody is connected
    // => false: world keeps running (NPCs/crops/raids advance while offline)
    giveClientsPower = true,       // Clients have authority over their position/hits
    logging = true,                // Write per-launch log files to logs/
    language = en,                 // Server language
    zipSaves = true,               // Compress world saves
    MOTD = "WickedHaze Necesse server"   // Server name / description in the list
}

# ===========================================================================
# 2) WORLD SETTINGS  (world.zip -> world/worldSettings.cfg)
#    Per-world behavior + cosmetics. Edit the file, re-zip into the world
#    save, then restart the service.
# ===========================================================================
WORLDSETTINGS = {
    allowCheats = false,           // true = enable cheats/creative tools
    difficulty = CLASSIC,          // TBD: world difficulty preset
    deathPenalty = DROP_MAIN_INVENTORY,
    //   NONE                  - keep everything on death
    //   DROP_MATS             - drop non-equipment/combat/special items
    //   DROP_MAIN_INVENTORY   - drop everything except hotbar + equipped
    //   DROP_FULL_INVENTORY   - drop everything on you (incl. equipped)
    //   HARDCORE              - character stays dead permanently
    raidFrequency = OCCASIONALLY,  // How often raids/attacks hit settlements
    survivalMode = true,           // True = survival (need food/shelter)
    playerHunger = true,           // True = hunger/stamina drain
    disableMobSpawns = false,      // True = no enemy mob spawns
    forcedPvP = false,             // True = players always PvP-enabled
    allowOutsideCharacters = true, // True = allow characters from outside world
    creativeMode = false,          // True = sandbox/creative
    disableMobAI = false,          // True = mobs are passive (no AI)
    canSettlersDie = false,        // True = settlers can permanently die
    dayTimeMod = 1.0,              // Day length multiplier [1.0 - 10.0]
    nightTimeMod = 1.0,            // Night length multiplier [1.0 - 10.0]
    gameVersion = 1.3.3            // Locked to the world's game version - DO NOT edit
}

# ===========================================================================
# Notes
# ===========================================================================
# - cfg/settings.cfg is CLIENT-side (rendering/controls) - not a server option.
# - cfg/auth holds the serialized UUID of the last authenticated player; that's
#   why a returning client skips the password prompt. Remove it to force all
#   players to re-enter the password (server recreates it on next login).
# - The death penalty can also be set live from the server console:
#       deathpenalty <none|drop_mats|drop_main_inventory|drop_full_inventory|hardcore>
#   and it persists into the world save.